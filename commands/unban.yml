      message: ⚠ Нет доступа ⚠
    no_data:
      id:
        message: "⚠ Ошибка: Вы не ввели айди/ссылку/умпоминие. ⚠"
    no_ban:
      message: ⚠ Он не заблокирован ⚠
    no_user_vk:
      message: ⚠ Данный вк юзер не найден
    unban_message:
      message: '[%config.bot.name%] %userlevel.name% *id%user.vkid% (%user.pref%) Снял(а) блокировку к доступу боту'
      user_id: "%targetuser.vkid%"
      random_id: 0
    unban:
      message: Вы разблокировали  доступ к боту *id%targetuser.vkid% (%targetuser.pref%)
