discord:
  name: unban
  description: разблокировать пользователя.
  options:
    - name: user
      description: пользователь
      type: 6
      required: true
  enabled: true
  level: 2
  aliases:
    - unban
telegram:
  command: unban
  description: разблокировать пользователя.
  enabled: true
  level: 2
  aliases:
    - unban
VK:
  enabled: true
  level: 2
  aliases:
    - unban
#==============================#
