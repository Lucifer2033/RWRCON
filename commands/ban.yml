discord:
  name: ban
  description: Заблокировать доступ к боту.
  options:
    - name: user
      description: пользователь которого надо заблокировать
      type: 6
      required: true
    - name: reason
      description: причина блокировки
      type: 3
      required: true
  enabled: true
  level: 2
  aliases:
    - ban
telegram:
  command: ban
  description: Заблокировать доступ к боту.
  enabled: true
  level: 2
  aliases:
    - ban
VK:
  enabled: true
  level: 2
  aliases:
    - ban
#==============================#
# +--------------------------+ #
# |       placeholders       | #
# +--------------------------+ #
# | доступные в этой команде | #
# +--------------------------+ #
# | %targetuser.id%          | #
# | %targetuser.pref%        | #
# | %targetuser.level%       | #
# | %targetuser.ban%         | #
# | %targetuser.vkid%        | #
# | %targetuser.tgid%        | #
# | %targetuser.ablc%        | #
# | %targetuser.absl%        | #
# +--------------------------+ #
# | %targetlevel.id%         | #
# | %targetlevel.name%       | #
# | %targetlevel.id_name%    | #
# +--------------------------+ #
#==============================#
Message:
  VK:
    no_user:
      message: ⚠ Данный пользователь не найден. ⚠
    no_permissions:
      message: ⚠ Нет доступа ⚠
    no_data:
      id:
        message: "⚠ Ошибка: Вы не ввели айди/ссылку/умпоминие. ⚠"
      reason:
        message: "⚠ Ошибка: Вы не ввели причину. ⚠"
    userban_level:
      message: Вы не можете выдать бан пользователю выше по иерархии
    isbanned:
      message: ⚠ Пользователь уже заблокирован. ⚠
    yourself:
      message: ⚠ Нельзя себя забанить. ⚠
    no_user_vk:
      message: ⚠ Данный вк юзер не найден
    banned_message:
      message:
        - "[%config.bot.name%] %userlevel.name% *id%user.vkid% (%user.pref%)\n"
        - "Выдал(а) вам блокировку в боте\n"
        - "Причина блокировки: %args[2]%\n"
      user_id: "%targetuser.vkid%"
      random_id: 0
    banned:
      message: Вы заблокировали пользавателю доступ к боту *id%targetuser.vkid%
        (%targetuser.pref%)
  TG:
    no_user:
      text: ⚠ Данный пользователь не найден. ⚠
    no_permissions:
      text: ⚠ Нет доступа ⚠
    no_data:
      id:
        text: "⚠ Ошибка: Вы не ввели айди/ссылку/умпоминие. ⚠"
      reason:
        text: "⚠ Ошибка: Вы не ввели причину. ⚠"
    userban_level:
      text: Вы не можете выдать бан пользователю выше по иерархии
    isbanned:
      text: ⚠ Пользователь уже заблокирован. ⚠
    yourself:
      text: ⚠ Нельзя себя забанить. ⚠
    no_user_tg:
      text: ⚠ Данный вк юзер не найден
    banned_message:
      text:
        - "[%config.bot.name%] %userlevel.name% [%user.pref%](tg://user?id=%user.tgid%)\n"
        - "Выдал(а) вам блокировку в боте\n"
        - "Причина блокировки: %args[2]%\n"
      chat_id: "%tguser.chat.id%"
      parse_mode: Markdown
    banned:
      text: Вы заблокировали пользавателю доступ к боту [%targetuser.pref%](tg://user?id=%targetuser.tgid%)
      parse_mode: Markdown
  DS:
    no_user:
      content: ⚠ Данный пользователь не найден. ⚠
    no_permissions:
      content: ⚠ Нет доступа ⚠
    no_data:
      id:
        content: "⚠ Ошибка: Вы не ввели айди/ссылку/умпоминие. ⚠"
      reason:
        content: "⚠ Ошибка: Вы не ввели причину. ⚠"
    userban_level:
      content: Вы не можете выдать бан пользователю выше по иерархии
    isbanned:
      content: ⚠ Пользователь уже заблокирован. ⚠
    yourself:
      content: ⚠ Нельзя себя забанить. ⚠
    no_user_ds:
      content: ⚠ Данный тг юзер не найден
    banned_message:
      content:
        - "[%config.bot.name%] %userlevel.name% [%user.pref%](https://discordapp.com/users/%user.dsid%)\n"
        - "Выдал(а) вам блокировку в боте\n"
        - "Причина блокировки: %args[2]%\n"
      channel_id: "%targetuser.dsid%"
    banned:
      content: Вы заблокировали пользавателю доступ к боту [%targetuser.pref%](https://discordapp.com/users/%targetuser.dsid%)
