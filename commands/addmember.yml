discord:
  name: rcon
  description: Настройка ркона.
  options:
    - name: addmember
      description: Создать пользователя.
      type: 1
      options:
        - name: id
          description: айди дс или ссылка или пинг
          type: 6
          required: true
        - name: nick
          description: никнейм пользователя
          type: 3
          required: true
        - name: level
          description: айди имя уровня
          type: 3
          required: true
  enabled: true
  level: 5
  aliases:
    - rcon addmember
telegram:
  command: rcon addmember
  description: Создает аккаунт.
  enabled: true
  level: 5
  aliases:
    - rcon addmember
VK:
  enabled: true
  level: 5
  aliases:
    - rcon addmember
