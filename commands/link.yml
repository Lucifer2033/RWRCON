discord:
  name: link
  description: связать аккаунт с тг или вк.
  options:
    - name: type
      description: тип аккаунта
      type: 3
      required: true
      choices:
        - name: VK
          value: vk
        - name: TG
          value: tg
        - name: DS
          value: ds
    - name: user
      description: пользователь которого нужно привязать
      type: 6
      required: true
    - name: stype
      description: тип аккаунта
      type: 3
      required: true
      choices:
        - name: VK
          value: vk
        - name: TG
          value: tg
        - name: DS
          value: ds
    - name: suser
      description: пользователь которого нужно привязать
      type: 6
      required: true
  enabled: true
  level: 4
  aliases:
    - link
telegram:
  command: link
  description: связать аккаунт с тг или вк.
  enabled: true
  level: 4
  aliases:
    - link
VK:
  enabled: true
  level: 4
  aliases:
    - link
