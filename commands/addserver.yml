discord:
  name: rcon
  description: Настройка ркона.
  options:
    - name: addserver
      description: Добавить сервер.
      type: 1
      options:
        - name: ip
          description: айпи сервера
          type: 3
          required: true
        - name: port
          description: порт сервера (для мониторинга)
          type: 4
          required: true
        - name: rport
          description: ркон порт
          type: 4
          required: true
        - name: password
          description: пароль от ркона
          type: 3
          required: true
        - name: name
          description: айди имя сервера
          type: 3
          required: true
        - name: prefix
          description: префикс сервера
          type: 3
          required: true
  enabled: true
  level: 5
  aliases:
    - rcon addserver
telegram:
  command: rcon addserver
  description: добавить сервер.
  enabled: true
  level: 5
  aliases:
    - rcon addserver
VK:
  enabled: true
  level: 5
  aliases:
    - rcon addserver
