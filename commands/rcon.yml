    mod:
      message:
        - "🔻 rcon status — Показать работающие севера."
    admin:
      message:
        - "🔻 rcon usercone [server] — выкл/вкл доступ сервер\n."
        - "🔻 rcon status — Показать работающие севера.\n"
        - "🔻 rcon renick [vkid/ссылка] [ник] — Изменить ник для пользователя."
    gladmin:
      message:
        - "🔻 rcon addserver [ip] [port/query port] [rcon port] [password] [id_name] [prefix] — добавить сервер.\n"
        - "🔻 rcon addblock [server] [cmd] — запретить команду для сервера.\n"
        - "🔻 rcon removeblock [server] [cmd] — разрешить команду для сервера.\n"
        - "🔻 rcon addwhite [server] [cmd] — добавить команду в белый список для сервера.\n"
        - "🔻 rcon removewhite [server] [cmd] — добавить команды из белого списка для сервера.\n"
        - "🔻 rcon addblack [server] [cmd] — добавить команды в черный список для сервера.\n"
        - "🔻 rcon removeblack [server] [cmd] — удалить команды из черного списка для сервера.\n"
        - "🔻 rcon addsymbol [server] [symbol] — добавить символ запрет для сервера.\n"
        - "🔻 rcon removesymbol [server] [symbol] — удалить символ из запрета для сервера.\n"
        - "🔻 rcon usercone [server] — выкл/вкл доступ сервер.\n"
        - "🔻 rcon status — Показать работающие севера.\n"
        - "🔻 rcon renick [vkid/ссылка] [ник] — Изменить ник для пользователя.\n"
        - "🔻 rcon upload — Загрузить файлы с командами.\n"
        - "🔻 rcon rename [sname] [nname/none] [prefix] — сменить название айди имя сервера и по желанию префикс.\n"
        - "🔻 rcon monitor [server] — выкл/вкл мониторинг сервер.\n"
        - "🔻 rcon setlvl [vkid/ссылка] [id_name/id] — Установить уровень для пользователя."
    rukovaditel:
      message:
        - "🔻 rcon addserver [ip] [port/query port] [rcon port] [password] [id_name] [prefix] — добавить сервер.\n"
        - "🔻 rcon addlevel [name] [id_name] — добавить уровень.\n"
        - "🔻 rcon removeserver [name] — удалить сервер.\n"
        - "🔻 rcon addblock [server] [cmd] — запретить команду для сервера.\n"
        - "🔻 rcon removeblock [server] [cmd] — разрешить команду для сервера"
        - "🔻 rcon addwhite [server] [cmd] — добавить команду в белый список для сервера.\n"
        - "🔻 rcon removewhite [server] [cmd] — добавить команды из белого списка для сервера.\n"
        - "🔻 rcon addblack [server] [cmd] — добавить команды в черный список для сервера.\n"
        - "🔻 rcon removeblack [server] [cmd] — удалить команды из черного списка для сервера.\n"
        - "🔻 rcon addsymbol [server] [symbol] — добавить символ запрет для сервера.\n"
        - "🔻 rcon removesymbol [server] [symbol] — удалить символ из запрета для сервера.\n"
