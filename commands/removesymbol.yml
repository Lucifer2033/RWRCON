discord:
  name: rcon
  description: Настройка ркона.
  options:
    - name: removesymbol
      description: удалить символ из запрета для сервера.
      type: 1
      options:
        - name: idname
          description: айди имя сервера
          type: 3
          required: true
        - name: symbol
          description: символ который надо удалить
          type: 3
          required: true
  enabled: true
  level: 4
  aliases:
    - rcon removesymbol
telegram:
  command: rcon removesymbol
  description: удалить символ из запрета для сервера.
  enabled: true
  level: 4
  aliases:
    - rcon removesymbol
VK:
