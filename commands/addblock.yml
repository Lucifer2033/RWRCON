discord:
  name: rcon
  description: Настройка ркона.
  options:
    - name: addblock
      description: запретить команду для сервера
      type: 1
      options:
        - name: server
          description: айди имя сервера
          type: 3
          required: true
        - name: command
          description: команда
          type: 3
          required: true
  enabled: true
  level: 4
  aliases:
    - rcon addblock
telegram:
  command: rcon addblock
  description: запретить команду для сервера.
  enabled: true
  level: 4
  aliases:
    - rcon addblock
VK:
  enabled: true
  level: 4
  aliases:
    - rcon addblock
