discord:
  name: rcon
  description: Настройка ркона.
  options:
    - name: redata
      description: Изменить данные сервера.
      type: 1
      options:
        - name: idname
          description: айди имя сервера
          type: 3
          required: true
        - name: ip
          description: айпи сервера или none
          type: 3
          required: true
        - name: port
          description: порт сервера или none
          type: 3
          required: true
        - name: rport
          description: ркон порт или none
          type: 3
          required: true
        - name: password
          description: пароль от ркон или none
          type: 3
          required: true
  enabled: true
  level: 5
  aliases:
    - rcon redata
telegram:
  command: rcon redata
  description: Изменить данные сервера.
  enabled: true
  level: 5
  aliases:
    - rcon redata
VK:
  enabled: true
  level: 5
  aliases:
    - rcon redata
