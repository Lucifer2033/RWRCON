discord:
  name: report
  description: написать админам об ошибке.
  options:
    - name: text
      description: текст
      type: 3
      required: true
  enabled: true
  level: 0
  aliases:
    - report
telegram:
  command: report
  description: написать админам об ошибке.
  enabled: true
  level: 0
  aliases:
    - report
VK:
  enabled: true
  level: 0
  aliases:
    - report
#==============================#
# +--------------------------+ #
# |       placeholders       | #
# +--------------------------+ #
# | доступные в этой команде | #
# +--------------------------+ #
# | %report.id%              | #
# | %report.sender%          | #
# | %report.messages%        | #
# +--------------------------+ #
# | %prefix.id%              | #
# | %prefix.name%            | #
# | %prefix.prefix%          | #
# +--------------------------+ #
#==============================#
Message:
  VK:
    no_user:
      message: ⚠ У Вас недостаточно прав для использования бота! Приобретите статус [CONSOLE] и Вы сможете использовать команды!
    no_permissions:
      message: ⚠ Нет доступа ⚠
    no_data:
      text:
        message: "⚠ Ошибка: Вы не ввели текст репорта. ⚠"
    found:
      message: "%user.pref%, Вы уже отправляли репорт Ваш репорт №%report.id%"
    report_send:
      message:
        - "%report.title%\n"
        - "🗣️ Отправил: %user.vkid%\n"
        - "✏️ ID жалобы: %report.id%\n"
        - "➡️ %user.pref%: %report.messages%"
      chat_id: "%config.logger.vk.chat.mod%"
      random_id: 0
    report_result:
      message: "%user.pref%, ваше сообщение отправлено. Номер заявки: №%report.id% 👍"
  TG:
    no_user:
      text: ⚠ У Вас недостаточно прав для использования бота! Приобретите статус [CONSOLE] и Вы сможете использовать команды!
