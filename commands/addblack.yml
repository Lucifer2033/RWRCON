discord:
  name: rcon
  description: Настройка ркона.
  options:
    - name: 'addblack'
      description: добавить команды в черный список для сервера
      type: 1
      options:
        - name: server
          description: айди имя сервера
          type: 3
          required: true
        - name: command
          description: команда
          type: 3
          required: true
  enabled: true
  level: 4
  aliases:
    - rcon addblack
