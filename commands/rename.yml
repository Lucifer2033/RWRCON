discord:
  name: rcon
  description: Настройка ркона.
  options:
    - name: rename
      description: сменить название айди имя сервера и по желанию префикс.
      type: 1
      options:
        - name: idname
          description: айди имя сервера
          type: 3
          required: true
        - name: nidname
          description: новый айди имя или none
          type: 3
          required: true
        - name: prefix
          description: префикс сервера
          type: 3
          required: false
  enabled: true
  level: 4
  aliases:
    - rcon rename
telegram:
  command: rcon rename
  description: сменить название айди имя сервера и по желанию префикс.
  enabled: true
  level: 4
  aliases:
    - rcon rename
VK:
  enabled: true
  level: 4
  aliases:
    - rcon rename
