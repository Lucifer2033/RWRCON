discord:
  name: rcon
  description: Настройка ркона.
  options:
    - name: relevel
      description: сменить название айди имя уровня и по желанию префикс.
      type: 1
      options:
        - name: idname
          description: айди имя уровня
          type: 3
          required: true
        - name: nidname
          description: новый айди имя или none
          type: 3
          required: true
        - name: prefix
          description: префикс уровня
          type: 3
          required: false
  enabled: true
  level: 5
  aliases:
    - rcon relevel
