    - install
telegram:
  command: install
  description: Первоначальной установки бота
  enabled: true
  level: 0
  aliases:
    - install
VK:
  enabled: true
  level: 0
  aliases:
    - install
Install:
  - RWRcon_User:
      - pref: Root
        level: 5
        ban: false
        vkid: null
        tgid: 1232323
        ablc: true
        absl: true
  - RWRcon_Level:
      - name: Console
        id_name: cons
      - name: Модератор
        id_name: mod
      - name: Администратор
        id_name: admin
      - name: Гл.Администратор
        id_name: gladmin
      - name: Руководитель
        id_name: rukovaditel
