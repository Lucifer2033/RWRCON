discord:
  name: give
  description: выдать доступ к серверу.
  options:
    - name: idname
      description: айди имя сервера
      type: 3
      required: true
    - name: user
      description: пользователь которому выдать доступ
      type: 6
      required: true
  enabled: true
  level: 3
  aliases:
    - give
telegram:
  command: give
  description: выдать доступ к серверу.
  enabled: true
  level: 3
  aliases:
    - give
VK:
  enabled: true
  level: 3
  aliases:
    - give
