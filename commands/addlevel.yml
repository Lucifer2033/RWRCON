discord:
  name: rcon
  description: Настройка ркона.
  options:
    - name: addlevel
      description: добавить уровень.
      type: 1
      options:
        - name: name
          description: Название уровня
          type: 3
          required: true
        - name: idname
          description: айди имя уровня
          type: 3
          required: true
  enabled: true
  level: 5
  aliases:
    - rcon addlevel
telegram:
  command: rcon addlevel
  description: добавить уровень.
  enabled: true
  level: 5
  aliases:
    - rcon addlevel
VK:
  enabled: true
  level: 5
  aliases:
    - rcon addlevel
