discord:
  name: rcon
  description: Настройка ркона.
  options:
    - name: setmode
      description: Поставить режим блокировки команд.
      type: 1
      options:
        - name: idname
          description: айди имя сервера
          type: 3
          required: true
        - name: type
          description: тип блокировки
          type: 4
          required: true
          choices:
            - name: Стандартная
              value: 1
            - name: Белый Список
              value: 2
  enabled: true
  level: 5
  aliases:
    - rcon setmode
telegram:
  command: rcon setmode
  description: Поставить режим блокировки команд.
  enabled: true
  level: 5
  aliases:
    - rcon setmode
VK:
  enabled: true
  level: 5
  aliases:
    - rcon setmode
