discord:
  name: rcon
  description: Настройка ркона.
  options:
    - name: setlvl
      description: Установить уровень для пользователя.
      type: 1
      options:
        - name: user
          description: пользователь
          type: 6
          required: true
        - name: level
          description: айди или айди название
          type: 3
          required: true
  enabled: true
  level: 4
  aliases:
    - rcon setlvl
telegram:
  command: rcon setlvl
  description: Установить уровень для пользователя.
  enabled: true
  level: 4
  aliases:
    - rcon setlvl
VK:
  enabled: true
  level: 4
  aliases:
    - rcon setlvl
