discord:
  name: rcon
  description: Настройка ркона.
  options:
    - name: addwhite
      description: добавить команду в белый список для сервера.
      type: 1
      options:
        - name: idname
          description: айди имя сервера
          type: 3
          required: true
        - name: command
          description: команда которую надо разрешить для сервера
          type: 3
          required: true
  enabled: true
  level: 4
  aliases:
    - rcon addwhite
telegram:
  command: rcon addwhite
  description: добавить команду в белый список для сервера.
  enabled: true
  level: 4
  aliases:
    - rcon addwhite
VK:
  enabled: true
  level: 4
  aliases:
    - rcon addwhite
